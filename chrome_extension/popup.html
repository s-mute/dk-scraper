<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DK Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      width: 260px;
      padding: 16px;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #cba6f7;
    }
    label {
      display: block;
      font-size: 12px;
      color: #a6adc8;
      margin-bottom: 3px;
    }
    input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #313244;
      color: #cdd6f4;
      font-size: 13px;
      margin-bottom: 10px;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #cba6f7;
    }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    #btnStart { background: #a6e3a1; color: #1e1e2e; }
    #btnStop  { background: #f38ba8; color: #1e1e2e; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #a6adc8;
      min-height: 18px;
      word-break: break-word;
    }
    #status.running { color: #a6e3a1; }
    #status.stopped { color: #f38ba8; }
  </style>
</head>
<body>
  <h1>📚 DK Scraper</h1>

  <label for="startPage">Start page</label>
  <input type="number" id="startPage" value="1" min="1" />

  <label for="totalPages">Total pages (blank = all)</label>
  <input type="number" id="totalPages" placeholder="∞" min="1" />

  <div class="row">
    <button id="btnStart">▶ Start</button>
    <button id="btnStop" disabled>⏹ Stop</button>
  </div>

  <div id="status">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
